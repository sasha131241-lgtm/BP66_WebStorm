<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/form.css">
    <script src="./js/user.js" defer></script>
    <script src="./js/userManager.js" defer></script>
    <script src="./js/app.js" defer></script>
</head>
<body>

    <main class="container">
        <h1>User Registration</h1>

        <form id="registrationForm" class="reg-form">
            <div class="form-group">
                <input type="text" id="nameInput" placeholder="Name" autocomplete="off">
            </div>
            
            <div class="form-group">
                <input type="number" id="ageInput" placeholder="Age" autocomplete="off">
            </div>

            <button type="submit" id="registerBtn">Register</button>
        </form>
		
		<!-- Область для вывода ошибок -->
        <div id="errorMessage" class="error-message hidden"></div>

        <section class="users-section">
            <h2>Registered Users</h2>
            <div id="usersList" class="users-list">
                <!-- Сюда будут динамически добавляться пользователи -->
            </div>
        </section>
    </main>

</body>
</html>
