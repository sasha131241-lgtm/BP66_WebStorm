<!DOCTYPE html>
<html lang = "en">
<head>
  <meta charset = "UTF-8">
  <title> Мой учебный профиль</title>
	<link rel = "stylesheet" href = "style.css">
</head>
<body>

<div class = "profile-container">
	<h1 class = "profile-title">Мой учебный профиль</h1>
	
	<div class = "profile-card">
		<div class = "profile-field">
			<span class = "label">Name:</span>
			<span class = "value">Alex</span>
		</div>
		
		<div class = "profile-field">
			<span class = "label">Age</span>
			<span class = "value">25</span>
		</div>
		
		<div class = "profile-field">
			<span class = "label">City:</span>
			<span class = "value">Netanya</span>
			
		</div>
		
		<div class = "profile-field">
			<span class = "label">course:</span>
			<span class = "value">Full Stack Developer </span>
		</div>
		
		<div class = "profile-field">
			<span class = "label">classes completed:</span>
			<span class = "value">100 hours of 150</span>
		</div>
		
		<div class = "profile-field highlight">
			<span class = "label">classes left:</span>
			<span class = "value">50 left</span>
		</div>
		
		
	</div>
</div>
</body>
</html>
